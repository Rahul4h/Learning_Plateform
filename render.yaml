services:
  - type: web
    name: interactive-learning-platform
    env: python
    buildCommand: "pip install -r requirements.txt && cd backend && python manage.py collectstatic --noinput"
    startCommand: "cd backend && python manage.py migrate && python manage.py bootstrap_demo_content && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
